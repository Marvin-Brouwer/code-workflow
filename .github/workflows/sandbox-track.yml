name: sandbox track

# One operating system: the checks, then the conformance suite for each backend it runs. The
# tracks run side by side, so a slow Windows runner doesn't hold up Linux.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      # A JSON list of { backend, experimental }.
      backends:
        type: string
        required: true
    secrets:
      E2B_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @mesh-flow/sandbox typecheck
      - run: pnpm --filter @mesh-flow/sandbox build
      - run: pnpm --filter @mesh-flow/sandbox test

  conformance:
    name: conformance (${{ matrix.backend }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.backends) }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      MESH_FLOW_SANDBOX_TESTS: ${{ matrix.backend }}
      # The key stays on the runner, the host side; it never enters a sandbox.
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      MESH_FLOW_E2B_TEMPLATE: ${{ vars.MESH_FLOW_E2B_TEMPLATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install runsc
        if: matrix.backend == 'gvisor'
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc

      - name: Allow KVM
        if: matrix.backend == 'microsandbox' && runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pull requests from forks get no secrets; E2B is then left out rather than failing.
      - name: Test
        if: matrix.backend != 'e2b' || env.E2B_API_KEY != ''
        run: pnpm --filter @mesh-flow/sandbox test
        env:
          RUNSC: ${{ matrix.backend == 'gvisor' && 'sudo runsc' || '' }}
