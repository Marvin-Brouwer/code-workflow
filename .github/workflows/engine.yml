name: engine

# Every package's own checks and the example apps' builds, then one run end to end on each real
# backend this OS has. Lint and format run repo-wide in the sandbox workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mesh-flow/protocol --filter @mesh-flow/build --filter @mesh-flow/gateway --filter @mesh-flow/engine --filter @mesh-flow/core --filter @mesh-flow/git --filter @mesh-flow/code-repository --filter @mesh-flow/github --filter @mesh-flow/gitlab --filter @mesh-flow/atlassian --filter @mesh-flow/toolchain-dotnet --filter @mesh-flow/preset-development --filter github-issue --filter example typecheck
      - run: pnpm --filter @mesh-flow/engine... --filter @mesh-flow/github... --filter @mesh-flow/gitlab... --filter @mesh-flow/atlassian... --filter @mesh-flow/toolchain-dotnet... --filter @mesh-flow/preset-development... build
      - run: pnpm --filter @mesh-flow/protocol --filter @mesh-flow/build --filter @mesh-flow/gateway --filter @mesh-flow/engine --filter @mesh-flow/core --filter @mesh-flow/git --filter @mesh-flow/code-repository --filter @mesh-flow/github --filter @mesh-flow/gitlab --filter @mesh-flow/atlassian --filter @mesh-flow/toolchain-dotnet --filter @mesh-flow/preset-development test
      # The example apps build and describe themselves with the packages just built.
      - run: pnpm --filter github-issue --filter example build

  real-backend:
    name: real backend (${{ matrix.os }}, ${{ matrix.backend }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: gvisor }
          - { os: ubuntu-latest, backend: microsandbox }
          - { os: windows-latest, backend: microsandbox }
    runs-on: ${{ matrix.os }}
    env:
      MESH_FLOW_ENGINE_TESTS: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install runsc
        if: matrix.backend == 'gvisor'
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc

      - name: Allow KVM
        if: matrix.backend == 'microsandbox' && runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test
        run: pnpm --filter @mesh-flow/engine exec vitest run test/real-backend.spec.mts
        env:
          RUNSC: ${{ matrix.backend == 'gvisor' && 'sudo runsc' || '' }}
