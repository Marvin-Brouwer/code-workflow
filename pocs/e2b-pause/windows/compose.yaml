# Windows only: runs E2B Embed inside a Linux container with its own Docker Engine.
# Linux and WSL distros with Docker Engine run Embed directly; see ../README.md.
name: e2b-windows

services:
  embed:
    build: .
    privileged: true
    ports:
      - "127.0.0.1:3000:3000" # API
      - "127.0.0.1:3001:3001" # dashboard
      - "127.0.0.1:3002:3002" # sandbox proxy
    volumes:
      # The kernel's modules and the live /dev, so Embed's host setup can load nbd for this kernel
      # and the NBD devices it creates show up in here.
      - /lib/modules:/lib/modules:ro
      - /dev:/dev
      # Kept across restarts and rebuilds: images, Embed's files, templates and snapshots.
      - docker-data:/var/lib/docker
      - embed:/embed
      - e2b-data:/var/lib/e2b
      - orchestrator:/orchestrator
      # sdk.env for the host script. Docker creates a missing .work as root on a Linux host, so the
      # entrypoint hands it to whoever owns this directory (read-only, only looked at).
      - ../.work:/out
      - .:/owner:ro
    stop_grace_period: 90s

networks:
  default:
    driver_opts:
      # WSL's mirrored networking routes 127.0.0.1 through its own interface, loopback0, instead of
      # lo. Docker drops traffic to 127.0.0.1-published ports that doesn't arrive on lo, so the ports
      # above time out there unless that interface is trusted. A name that doesn't exist is ignored.
      com.docker.network.bridge.trusted_host_interfaces: loopback0

volumes:
  docker-data:
  embed:
  e2b-data:
  orchestrator:
